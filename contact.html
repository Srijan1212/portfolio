    <form

        type="text"

        placeholder="Your name"
        required
      >

        type="email"
        id="email"
        name="Email"
        placeholder="your@email.com"
        required
      >


      <label for="subject">Subject</label>

      <input
        type="text"
        id="subject"
        name="Subject"
        placeholder="What is this about?"
        required
      >


      <label for="message">Message</label>

      <textarea
        id="message"
        name="Message"
        rows="7"
        placeholder="Write your message here..."
        required
      ></textarea>


      <button
        type="submit"
        class="btn primary"
      >
        Send Message
      </button>
